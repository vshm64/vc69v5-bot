# ======================================================================
#  تنظیمات ربات VC69V5  -  همه چیز اینجاست
# ----------------------------------------------------------------------
#  این فایل را مستقیم در GitHub ویرایش کنید (آیکون مداد) و Commit بزنید.
#  اجرای بعدی ربات (حداکثر ۱۵ دقیقه بعد) تنظیمات جدید را خودکار برمی‌دارد.
#  اگر اشتباه بنویسید، ربات اجرا نمی‌شود و پیام خطا در تلگرام می‌آید.
#
#  فرمت سیگنال در تلگرام:   Spot: 2/15/40/50
#     2  = تعداد صرافی‌های تأییدکننده در آن بازار
#     15 = تعداد صرافی‌های دارای داده (معامله) در همان بازار
#     40 = درصد حجم آن صرافی‌های تأییدکننده نسبت به کل حجم همان بازار
#     50 = درصد حجم همه منابع تأییدکننده نسبت به کل حجم همه بازارها
#
#  قانون سیگنال برای هر ارز:
#     یک بازار (spot یا futures یا cfd) شرط خودش را داشته باشد
#     (exchanges و weight آن بازار)  و  total_weight هم برقرار باشد.
#     exchanges = 0 یعنی آن بازار غیرفعال است.
#     total_weight = 0 یعنی شرط وزن کل خاموش است.
# ======================================================================

[telegram]
# پیام تست تلگرام فقط یک بار (اولین اجرا) ارسال می‌شود.
# برای ارسال دوباره، این عدد را عوض کنید (مثلاً 1 را 2 کنید).
test_message_id = 1

[tradingview]
# روی GitHub آی‌پی سرورها توسط TradingView بسته است؛ روشن‌کردن فقط اجرا را کند می‌کند.
# اگر روشن کنید باید TV_USER و TV_PASS را هم در Secrets بگذارید (اختیاری).
enabled = false

[exchanges]
# صرافی‌هایی که نمی‌خواهید استفاده شوند، مثلاً ["BINANCE", "BYBIT"]
exclude = []

[runtime]
first_run_tehran = ""        # مثال: "2026-11-08 13:30" ؛ خالی = بدون انتظار
first_window_min = 15        # اولین اجرا فقط کندل‌های ۱۵ دقیقه اخیر را بررسی می‌کند
max_lookback_min = 360       # اگر ربات مدتی اجرا نشده بود، حداکثر تا ۶ ساعت عقب‌تر را بررسی می‌کند
max_run_minutes = 10         # سقف زمان هر اجرا (جلوگیری از گیرکردن)
exchange_load_seconds = 150
backfill_seconds = 150
tv_seconds = 120

# ----------------------------------------------------------------------
#  مقادیر مشترک همه ارزها. هر ارز می‌تواند هر کدام را در بخش خودش عوض کند.
# ----------------------------------------------------------------------
[defaults]
chart_timeframes = ["3m", "15m", "30m", "45m"]   # تایم‌فریم چارت (حداقل 3m)
lower_timeframe = "1m"       # LTF  (باید از تایم‌فریم چارت کوچک‌تر و مقسوم‌علیه آن باشد)
different = 5                # ورودی Different اندیکاتور
min_volume = 69              # ورودی Min Volume اندیکاتور (حداقل 55)
volume_sma_length = 20       # طول میانگین حجم
show_global_signals = false  # سیگنال GLOBAL LONG / SHORT

# ----------------------------------------------------------------------
#  تنظیمات هر ارز (مقدارهای زیر نقطه شروع است؛ بر اساس نتیجه لاگ تنظیم کنید)
#  spot / futures / cfd:
#     exchanges = حداقل تعداد صرافی تأییدکننده در آن بازار
#     weight    = حداقل درصد حجم آن صرافی‌ها نسبت به کل حجم همان بازار
#  total_weight = حداقل درصد حجم همه منابع تأییدکننده نسبت به کل حجم همه بازارها
# ----------------------------------------------------------------------
[BTC]
enabled = true
chart_timeframes = ["3m", "15m", "30m", "45m"]
lower_timeframe = "1m"
spot    = { exchanges = 3, weight = 20 }
futures = { exchanges = 3, weight = 20 }
cfd     = { exchanges = 0, weight = 0 }
total_weight = 30

[PEPE]
enabled = true
chart_timeframes = ["3m", "15m", "30m", "45m"]
lower_timeframe = "1m"
spot    = { exchanges = 3, weight = 20 }
futures = { exchanges = 3, weight = 20 }
cfd     = { exchanges = 0, weight = 0 }
total_weight = 30

[ZEC]
enabled = true
chart_timeframes = ["3m", "15m", "30m", "45m"]
lower_timeframe = "1m"
spot    = { exchanges = 2, weight = 20 }
futures = { exchanges = 2, weight = 20 }
cfd     = { exchanges = 0, weight = 0 }
total_weight = 30
