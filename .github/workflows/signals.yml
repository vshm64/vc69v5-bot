name: vc69v5-signals

# Reliable 15-minute cadence WITHOUT GitHub's flaky "schedule" trigger.
# Runs are kept on the quarter-hour boundaries :00/:15/:30/:45
# (identical in Tehran time, UTC+3:30 is a quarter-hour offset).
# GitHub skips/delays most scheduled runs on quiet repos (observed: 3 runs
# in ~20 hours!). Instead, EVERY run re-dispatches itself via the
# workflow_dispatch API at the end (dispatch runs are NEVER skipped -
# same as the manual "Run workflow" button). GitHub docs explicitly
# allow GITHUB_TOKEN to call workflow_dispatch (it is the documented
# exception to the "events do not trigger workflows" rule).
#
# Start the chain:  Actions tab -> vc69v5-signals -> "Run workflow" (once).
# Stop the chain:   Actions tab -> "..." -> "Disable workflow".
# If the chain ever dies (long outage, cancelled run): just click
# "Run workflow" once again.

on:
  workflow_dispatch:        # manual button + the self-chain trigger

permissions:
  contents: write           # needed to commit the state file back
  actions: write            # needed to re-trigger the next run

concurrency:
  group: vc69v5-signals
  cancel-in-progress: false # a queued run never kills the running one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      # NOTE: TradingView blocks datacenter IPs (GitHub runners included),
      # so the TV feeds (CFD/TV-spot/TV-perp) may be dead here even with a
      # login - the ccxt spot/futures families keep working regardless.
      TV_USER: ${{ secrets.TV_USER }}
      TV_PASS: ${{ secrets.TV_PASS }}
      FIRST_RUN_TEHRAN: "2026-11-11 13:02"   # first check: 13:30 Tehran (past = no waiting)
      CHART_TFS: "3m,15m,30m,45m"            # chart timeframes
      LOWER_TF: "1m"                         # lower timeframe
      ASSETS: "BTC,PEPE,ZEC"                 # BTC/PEPE/ZEC only (spot+futures, ccxt+TV)
      FIRST_WINDOW_MIN: "15"                 # first run baseline: last quarter hour
      MAX_LOOKBACK_MIN: "360"
      # ============ SIGNAL THRESHOLDS - the easy knob ============
      # Per-asset rule "ASSET=COUNT[/WEIGHT%]": a signal fires when ANY ONE
      # market family (spot/futures/CFD/TV-spot/TV-perp) ON ITS OWN reaches
      # BOTH numbers - a "Spot: 6/15/40" line alone fires BTC. Counts summed
      # ACROSS families (2+2+2=6) never fire. WEIGHT defaults to 40.
      # EDIT the line below -> commit -> the NEXT chained run (~15 min)
      # picks it up automatically, no restart. The bot never reads the
      # Windows GUI settings. Deleting the line = defaults coded in
      # vc69v5_app.py are used instead.
      #
      # Recipes (measured on 3 days of real data, 3 assets, TV feeds dead
      # like on GitHub servers):
      #   BTC=2/10,PEPE=2/10,ZEC=2/10   very sensitive: ~60+ signals/day
      #   BTC=4/30,PEPE=4/30,ZEC=3/40   middle ground: a few per day
      #   BTC=6/40,PEPE=6/40,ZEC=3/40   strict: PEPE then needs TradingView
      #                                 (blocked on GitHub servers!) so PEPE
      #                                 stays silent here - only ZEC fires
      #   none                          no per-asset rules: every asset uses
      #                                 MIN_EXCHANGES/MIN_CONFIRM below
      SIGNAL_MIN_COUNTS: "BTC=2/10,PEPE=2/10,ZEC=2/10"
      # --- other OPTIONAL knobs (uncomment to change) ---
      # MIN_EXCHANGES: "2"     # min confirming exchanges for assets WITHOUT a per-asset rule
      # MIN_CONFIRM: "0.1"     # min combined weight: 0.1 = 10%, 0.2 = 20%
      # DIFFERENT: "5"         # indicator "different" input
      # MIN_VOL: "69"          # min 1m volume
      # VOL_SMA_LEN: "20"      # volume SMA length
      # SHOW_GLOBAL: "0"       # "1" = also GLOBAL LONG/SHORT signals
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for new signals
        run: python vc69v5_headless.py --state state/state.json

      - name: Commit state
        run: |
          git config user.name "vc69v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          git push

      # Chain link: sleep until the NEXT quarter-hour WALL-CLOCK boundary
      # (:00/:15/:30/:45), then dispatch the next run so it starts right on
      # the boundary - freshly closed candles are checked within ~5 minutes.
      # Runs even if a previous step FAILED (but not on cancel).
      - name: Chain - wait for next quarter-hour, then re-trigger
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOW=$(date +%s)
          LEFT=$(( (NOW / 900 + 1) * 900 - NOW ))
          if [ "$LEFT" -lt 60 ]; then LEFT=$(( LEFT + 900 )); fi
          echo "waiting ${LEFT}s until the next quarter-hour boundary"
          sleep "$LEFT"
          for i in 1 2 3; do
            gh workflow run signals.yml --ref main && exit 0
            echo "dispatch failed (try $i/3) - retrying in 20s"
            sleep 20
          done
          echo "could not dispatch the next run - chain stops, restart manually" >&2
          exit 1
