name: vc69v5-signals

# Keeps a 15-minute cadence WITHOUT GitHub's unreliable "schedule" trigger:
# every run re-dispatches itself at the end (workflow_dispatch is never skipped).
#
# Start the chain:  Actions tab -> vc69v5-signals -> "Run workflow" (once).
# Stop the chain:   Actions tab -> "..." -> "Disable workflow".
# If the chain ever dies (cancelled run, long outage): click "Run workflow" again.
#
# ALL signal settings are in settings.toml (not here).
# Secrets needed: TG_TOKEN, TG_CHAT   (optional: TV_USER, TV_PASS)

on:
  workflow_dispatch:

permissions:
  contents: write           # commit the state file back
  actions: write            # start the next run

concurrency:
  group: vc69v5-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT: ${{ secrets.TG_CHAT }}
      TV_USER: ${{ secrets.TV_USER }}
      TV_PASS: ${{ secrets.TV_PASS }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install TradingView support (only when enabled in settings.toml)
        run: |
          if python -c "import tomllib,sys; d=tomllib.load(open('settings.toml','rb')); sys.exit(0 if d.get('tradingview',{}).get('enabled') else 1)"; then
            pip install -r requirements-tv.txt || echo "::warning::TradingView packages failed to install"
          else
            echo "TradingView disabled in settings.toml - skipped"
          fi

      - name: Check for new signals
        run: python vc69v5_headless.py --state state/state.json

      # runs even when the check failed, so partial progress is never lost
      - name: Commit state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "vc69v5-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push && exit 0
            sleep 5
          done
          echo "::warning::could not push the state file"

      # Chain link: sleep until the next quarter-hour (:00/:15/:30/:45), then start the next run.
      - name: Chain - wait for next quarter-hour, then re-trigger
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          NOW=$(date +%s)
          LEFT=$(( (NOW / 900 + 1) * 900 - NOW ))
          if [ "$LEFT" -lt 60 ]; then LEFT=$(( LEFT + 900 )); fi
          echo "waiting ${LEFT}s until the next quarter-hour boundary"
          sleep "$LEFT"
          for i in 1 2 3; do
            gh workflow run signals.yml --ref "$REF" && exit 0
            echo "dispatch failed (try $i/3) - retrying in 20s"
            sleep 20
          done
          echo "could not dispatch the next run - chain stops, restart manually" >&2
          exit 1
